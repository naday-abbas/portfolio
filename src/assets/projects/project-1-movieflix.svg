<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <linearGradient id="mf-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0d0d0f"/>
    </linearGradient>
    <linearGradient id="spiderman" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="renegade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <linearGradient id="resident" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="coyote" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="70%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#292524"/>
    </linearGradient>
    <linearGradient id="odyssey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#831843"/>
      <stop offset="60%" stop-color="#500724"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="60%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="runner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="680" fill="url(#mf-bg)"/>

  <!-- Top Navbar -->
  <rect width="1200" height="52" fill="#111113"/>
  <text x="32" y="34" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" letter-spacing="-0.5">MovieFlix</text>
  <text x="1060" y="33" fill="#818cf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Home</text>
  <text x="1120" y="33" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Favorites</text>

  <!-- Search Bar Header -->
  <g transform="translate(410, 80)">
    <rect width="310" height="36" rx="4" fill="#222225" stroke="#38383e" stroke-width="1"/>
    <text x="14" y="23" fill="#71717a" font-family="system-ui, sans-serif" font-size="12">Search for Movies...</text>
    <rect x="318" width="64" height="36" rx="4" fill="#dc2626"/>
    <text x="332" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Search</text>
  </g>

  <!-- Movie Cards Row 1 -->
  <!-- 1: Spider-Man -->
  <g transform="translate(30, 140)">
    <rect width="145" height="220" rx="6" fill="url(#spiderman)"/>
    <circle cx="72" cy="80" r="42" fill="#ef4444" opacity="0.9"/>
    <path d="M50 75 Q72 105 94 75 Q72 85 50 75 Z" fill="#ffffff"/>
    <text x="72" y="160" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">SPIDER-MAN</text>
    <text x="72" y="174" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="9" font-weight="600">BRAND NEW DAY</text>
    <text x="0" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Spider-Man: Brand New Day</text>
    <text x="0" y="254" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">2026</text>
  </g>

  <!-- 2: Renegade Immortal -->
  <g transform="translate(195, 140)">
    <rect width="145" height="220" rx="6" fill="url(#renegade)"/>
    <circle cx="72" cy="85" r="38" fill="#fbbf24" opacity="0.7"/>
    <text x="72" y="160" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="11" font-weight="800">RENEGADE</text>
    <text x="72" y="174" text-anchor="middle" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="8" font-weight="600">IMMORTAL</text>
    <text x="0" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Renegade Immortal: Slayer</text>
    <text x="0" y="254" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">2026</text>
  </g>

  <!-- 3: Resident Evil -->
  <g transform="translate(360, 140)">
    <rect width="145" height="220" rx="6" fill="url(#resident)"/>
    <path d="M72 40 L72 130 M50 70 L94 100 M94 70 L50 100" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
    <text x="72" y="165" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="1">RESIDENT EVIL</text>
    <text x="0" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Resident Evil</text>
    <text x="0" y="254" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">2026</text>
  </g>

  <!-- 4: Coyote vs Acme -->
  <g transform="translate(525, 140)">
    <rect width="145" height="220" rx="6" fill="url(#coyote)"/>
    <circle cx="72" cy="90" r="36" fill="#1c1917" stroke="#ea580c" stroke-width="2"/>
    <path d="M72 54 Q85 45 95 40" stroke="#fef08a" stroke-width="2.5" fill="none"/>
    <circle cx="96" cy="39" r="3.5" fill="#fef08a"/>
    <text x="72" y="94" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="900">COYOTE</text>
    <text x="72" y="105" text-anchor="middle" fill="#ea580c" font-family="system-ui, sans-serif" font-size="8" font-weight="900">VS ACME</text>
    <text x="0" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Coyote vs. Acme</text>
    <text x="0" y="254" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">2026</text>
  </g>

  <!-- 5: The Odyssey -->
  <g transform="translate(690, 140)">
    <rect width="145" height="220" rx="6" fill="url(#odyssey)"/>
    <path d="M72 45 L92 80 L52 80 Z" fill="#be185d" opacity="0.8"/>
    <circle cx="72" cy="95" r="26" fill="#9d174d" opacity="0.7"/>
    <text x="72" y="165" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1">THE ODYSSEY</text>
    <text x="0" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">The Odyssey</text>
    <text x="0" y="254" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">2026</text>
  </g>

  <!-- 6: The Fix -->
  <g transform="translate(855, 140)">
    <rect width="145" height="220" rx="6" fill="url(#fix)"/>
    <circle cx="72" cy="75" r="32" fill="#b45309" opacity="0.8"/>
    <text x="72" y="145" text-anchor="middle" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="14" font-weight="900">THE FIX</text>
    <text x="72" y="160" text-anchor="middle" fill="#fde68a" font-family="system-ui, sans-serif" font-size="8">SETTLE THE SCORE</text>
    <text x="0" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">The Fix</text>
    <text x="0" y="254" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">2026</text>
  </g>

  <!-- 7: Runner -->
  <g transform="translate(1020, 140)">
    <rect width="145" height="220" rx="6" fill="url(#runner)"/>
    <text x="72" y="80" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="18" font-weight="900" letter-spacing="2">RUNNER</text>
    <text x="0" y="240" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">Runner</text>
    <text x="0" y="254" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">2026</text>
  </g>

  <!-- Row 2 preview snippets (half visible) -->
  <g transform="translate(30, 420)">
    <rect width="145" height="240" rx="6" fill="#1e293b"/>
    <text x="72" y="110" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">THE END OF OAK STREET</text>
  </g>
  <g transform="translate(195, 420)">
    <rect width="145" height="240" rx="6" fill="#78350f"/>
    <text x="72" y="110" text-anchor="middle" fill="#fef3c7" font-family="system-ui, sans-serif" font-size="11" font-weight="700">SURVIVOR</text>
  </g>
  <g transform="translate(360, 420)">
    <rect width="145" height="240" rx="6" fill="#831843"/>
    <text x="72" y="110" text-anchor="middle" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">LOVE HYPOTHESIS</text>
  </g>
  <g transform="translate(525, 420)">
    <rect width="145" height="240" rx="6" fill="#ea580c"/>
    <text x="72" y="110" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="900">DIGGER</text>
  </g>
  <g transform="translate(690, 420)">
    <rect width="145" height="240" rx="6" fill="#991b1b"/>
    <text x="72" y="110" text-anchor="middle" fill="#fee2e2" font-family="system-ui, sans-serif" font-size="12" font-weight="800">RETRIBUTION</text>
  </g>
  <g transform="translate(855, 420)">
    <rect width="145" height="240" rx="6" fill="#064e3b"/>
    <text x="72" y="110" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="14" font-weight="900">COLONY</text>
  </g>
  <g transform="translate(1020, 420)">
    <rect width="145" height="240" rx="6" fill="#1e1b4b"/>
    <text x="72" y="110" text-anchor="middle" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="14" font-weight="900">MUTINY</text>
  </g>
</svg>